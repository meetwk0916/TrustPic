<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrustPic</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>TrustPic</h1>
          <p id="subtitle">右键图片证据报告</p>
        </div>
        <button id="localeButton" class="locale-toggle" type="button">English</button>
      </header>

      <div id="notice" class="notice"></div>

      <section id="sourceSection" class="source-section" hidden>
        <span id="sourceLabel">图片来源</span>
        <a id="sourceLink" href="#" target="_blank" rel="noreferrer"></a>
      </section>

      <section id="report" class="report" hidden>
        <section class="interpretation">
          <section class="confidence-card">
            <span id="confidenceLabel">置信度</span>
            <strong id="confidenceValue"></strong>
          </section>
          <section class="conclusion-card">
            <h2 id="conclusionLabel">结论</h2>
            <p id="conclusionText"></p>
          </section>
        </section>

        <section id="aiAlert" class="ai-alert" hidden>
          <span id="aiAlertLabel">AI 相关证据</span>
          <strong id="aiAlertSummary"></strong>
          <p id="aiAlertMeans"></p>
        </section>

        <section>
          <h2 id="coreEvidenceLabel">核心证据</h2>
          <div id="evidenceList" class="evidence-list"></div>
        </section>

        <section id="localDifferenceSection" class="local-difference-section" hidden>
          <h2 id="localDifferenceLabel">局部差异分析</h2>
          <div id="localDifferenceEvidence" class="evidence-list"></div>
          <div id="heatmapPanel" class="heatmap" hidden>
            <h3 id="heatmapLabel">局部差异热图</h3>
            <img id="heatmap" alt="ELA heatmap" />
          </div>
        </section>

        <section class="notes">
          <h2 id="notesLabel">报告怎么读</h2>
          <ul id="limits"></ul>
        </section>
      </section>
    </main>

    <template id="evidenceTemplate">
      <article class="evidence-card">
        <header>
          <div>
            <h3></h3>
            <p class="summary"></p>
          </div>
          <span class="status"></span>
        </header>
        <details>
          <summary class="expand-label">展开解释</summary>
          <div class="explain-grid">
            <div>
              <h4 class="means-label">能说明什么</h4>
              <p class="means"></p>
            </div>
            <div>
              <h4 class="does-not-label">不能说明什么</h4>
              <p class="does-not"></p>
            </div>
          </div>
          <details class="technical-details" hidden>
            <summary class="technical-label">技术细节</summary>
            <pre></pre>
          </details>
        </details>
      </article>
    </template>

    <script src="sidepanel.js"></script>
  </body>
</html>
