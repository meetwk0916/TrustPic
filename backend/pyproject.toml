[project]
name = "trustpic-backend"
version = "0.1.0"
description = "TrustPic v0 evidence report API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pillow>=10.4.0",
  "pydantic>=2.8.0",
  "c2pa-python>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
]
datasets = [
  "datasets>=2.20.0",
  "socksio>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
