services:
  - type: web
    name: trustpic-api
    runtime: docker
    rootDir: backend
    plan: standard
    healthCheckPath: /api/v1/health
    envVars:
      - key: TRUSTPIC_ALLOWED_ORIGINS
        sync: false
      - key: TRUSTPIC_MAX_UPLOAD_MB
        value: "15"
      - key: TRUSTPIC_MAX_PIXELS
        value: "40000000"
